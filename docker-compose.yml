version: '3.8'

services:
  youtube-audio-bot:
    build: .
    container_name: youtube-audio-bot
    restart: always
    env_file:
      - .env
    volumes:
      # Persist downloads folder
      - ./downloads:/app/downloads
      # Mount credentials (important for Google Drive auth)
      - ./oauth_credentials.json:/app/oauth_credentials.json:ro
      - ./credentials.json:/app/credentials.json:ro
      - ./token.pickle:/app/token.pickle
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
